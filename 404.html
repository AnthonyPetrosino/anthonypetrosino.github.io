<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Page Not Found | Anthony Petrosino</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #0b3b3c;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  /* ---------- Pond canvas ---------- */
  #pond {
    position: fixed;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    cursor: default;   /* a crosshair reads clinical; leave the pointer soft */
  }

  /* Everything eases in over a couple of seconds instead of snapping on. */
  .veil {
    position: fixed;
    inset: 0;
    background: #04191b;
    pointer-events: none;
    animation: veilOut 2.4s ease-out forwards;
  }

  @keyframes veilOut { to { opacity: 0; visibility: hidden; } }

  @keyframes riseIn {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* A slow swell, roughly the pace of an easy breath. */
  @keyframes breathe {
    0%, 100% { opacity: 0.92; transform: scale(1); }
    50%      { opacity: 1;    transform: scale(1.014); }
  }

  /* Soft vignette so the centered text stays readable over the water */
  .vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at center,
                rgba(4, 26, 28, 0.55) 0%,
                rgba(4, 26, 28, 0.25) 45%,
                rgba(4, 26, 28, 0.7) 100%);
  }

  /* ---------- Centered content ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    pointer-events: none; /* let clicks through to the pond */
  }

  .code {
    font-size: clamp(4.5rem, 16vw, 10rem);
    font-weight: 200;
    letter-spacing: 0.14em;
    line-height: 1;
    color: #f4fbf8;
    text-shadow: 0 4px 40px rgba(0, 0, 0, 0.55);
    animation: riseIn 2s 0.3s ease-out both, breathe 9s 2.3s ease-in-out infinite;
  }

  .headline {
    margin-top: 0.75rem;
    font-size: clamp(1rem, 3.4vw, 1.4rem);
    font-weight: 300;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #eaf7f2;
    text-shadow: 0 2px 18px rgba(0, 0, 0, 0.6);
    animation: riseIn 2s 0.7s ease-out both;
  }

  .sub {
    margin-top: 1.1rem;
    max-width: 27rem;
    font-size: 0.95rem;
    font-weight: 300;
    line-height: 1.85;
    color: rgba(234, 247, 242, 0.72);
    text-shadow: 0 2px 14px rgba(0, 0, 0, 0.6);
    animation: riseIn 2s 1.1s ease-out both;
  }

  .home-link {
    pointer-events: auto;
    animation: riseIn 2s 1.5s ease-out both;
    margin-top: 2.25rem;
    display: inline-block;
    padding: 0.75rem 1.75rem;
    border: 1px solid rgba(113, 194, 139, 0.8);
    border-radius: 999px;
    background: rgba(113, 194, 139, 0.12);
    color: #d8f2e2;
    font-size: 0.95rem;
    font-weight: 500;
    letter-spacing: 0.03em;
    text-decoration: none;
    backdrop-filter: blur(4px);
    transition: background 0.25s ease, color 0.25s ease, transform 0.25s ease;
  }

  /* Slower, softer transitions than the rest of the site: nothing here
     should feel like it wants to be clicked in a hurry. */
  .home-link { transition: background 0.6s ease, color 0.6s ease, transform 0.6s ease; }

  .home-link:hover,
  .home-link:focus-visible {
    background: rgba(113, 194, 139, 0.85);
    color: #06272a;
    transform: translateY(-2px);
    outline: none;
  }

  .home-link:focus-visible { box-shadow: 0 0 0 3px rgba(113, 194, 139, 0.45); }

  .hint {
    position: fixed;
    bottom: 1.5rem;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 0.8rem;
    font-weight: 300;
    letter-spacing: 0.08em;
    color: rgba(234, 247, 242, 0.42);
    pointer-events: none;
    text-shadow: 0 1px 10px rgba(0, 0, 0, 0.6);
    animation: riseIn 3s 2.4s ease-out both;
  }

  /* ---------- Ambient sound toggle ---------- */
  .sound-toggle {
    position: fixed;
    bottom: 1.25rem;
    right: 1.25rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 0.9rem;
    border: 1px solid rgba(234, 247, 242, 0.18);
    border-radius: 999px;
    background: rgba(6, 38, 40, 0.35);
    color: rgba(234, 247, 242, 0.55);
    font-family: inherit;
    font-size: 0.72rem;
    font-weight: 400;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    backdrop-filter: blur(6px);
    transition: color 0.5s ease, border-color 0.5s ease, background 0.5s ease;
    animation: riseIn 3s 2.4s ease-out both;
  }

  .sound-toggle:hover,
  .sound-toggle:focus-visible {
    color: rgba(234, 247, 242, 0.9);
    border-color: rgba(113, 194, 139, 0.6);
    outline: none;
  }

  .sound-toggle[aria-pressed="true"] {
    color: #cdeedb;
    border-color: rgba(113, 194, 139, 0.7);
    background: rgba(113, 194, 139, 0.14);
  }

  /* Three bars that only animate while sound is playing. */
  .bars { display: flex; align-items: flex-end; gap: 2px; height: 11px; }
  .bars i {
    display: block;
    width: 2px;
    height: 3px;
    border-radius: 1px;
    background: currentColor;
    transition: height 0.4s ease;
  }
  .sound-toggle[aria-pressed="true"] .bars i { animation: eq 1.9s ease-in-out infinite; }
  .sound-toggle[aria-pressed="true"] .bars i:nth-child(2) { animation-delay: 0.35s; }
  .sound-toggle[aria-pressed="true"] .bars i:nth-child(3) { animation-delay: 0.7s; }

  @keyframes eq {
    0%, 100% { height: 3px; }
    50%      { height: 11px; }
  }

  @media (max-width: 480px) {
    .sub { font-size: 0.875rem; }
    .hint { font-size: 0.7rem; bottom: 3.75rem; }
    .sound-toggle { bottom: 1rem; right: 50%; transform: translateX(50%); }
  }

  /* Honour the OS setting: keep the scene, drop the motion. */
  @media (prefers-reduced-motion: reduce) {
    .code, .headline, .sub, .home-link, .hint, .sound-toggle {
      animation: none;
    }
    .veil { display: none; }
    .sound-toggle[aria-pressed="true"] .bars i { animation: none; height: 7px; }
  }
</style>
</head>
<body>

<canvas id="pond" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>

<div class="veil" aria-hidden="true"></div>

<main class="overlay">
  <p class="code">404</p>
  <h1 class="headline">Page Not Found</h1>
  <p class="sub">This page drifted off somewhere. There is no hurry &mdash; stay a while, feed the koi, and head back whenever you are ready.</p>
  <a class="home-link" href="/">Return Home</a>
</main>

<p class="hint" aria-hidden="true">move your cursor to stir the water &middot; click to feed the koi</p>

<button class="sound-toggle" type="button" aria-pressed="false" aria-label="Toggle ambient pond sound">
  <span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>
  <span class="sound-label">Sound</span>
</button>

<script>
(function () {
  'use strict';

  const canvas = document.getElementById('pond');
  const ctx = canvas.getContext('2d');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const speedScale = reduceMotion ? 0.4 : 1;

  let W = 0, H = 0;

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  /* ------------------------------------------------------------------
     Small vector helpers (kept inline to avoid any library overhead)
  ------------------------------------------------------------------ */
  function limit(v, max) {
    const m = Math.hypot(v.x, v.y);
    if (m > max && m > 0) { v.x = (v.x / m) * max; v.y = (v.y / m) * max; }
    return v;
  }

  function setMag(v, mag) {
    const m = Math.hypot(v.x, v.y);
    if (m > 0) { v.x = (v.x / m) * mag; v.y = (v.y / m) * mag; }
    return v;
  }

  let T = 0;   // shared clock, so the current is the same for every drifting thing

  /* A very slow swirling current. Two out-of-phase sine waves are enough to
     read as moving water, and having koi, pads and petals all share it is
     what makes the pond feel like one body rather than separate sprites. */
  function current(x, y) {
    return {
      x: Math.sin(y * 0.0055 + T * 0.00012) * 0.045 + Math.sin(T * 0.00006) * 0.02,
      y: Math.cos(x * 0.0048 - T * 0.00010) * 0.04 + Math.cos(T * 0.00008) * 0.015
    };
  }

  /* ------------------------------------------------------------------
     Interaction state
  ------------------------------------------------------------------ */
  const mouse = { x: -9999, y: -9999, active: false };
  const ripples = [];
  const food = [];

  const REPEL_RADIUS = 130;   // how close the cursor has to be to scatter fish
  const FOOD_SENSE = 460;     // how far a koi can smell a pellet
  const FOOD_LIFE = 12;       // seconds before a pellet dissolves
  const CLAIM_TIMEOUT = 10;   // give up a claim if the trip takes too long

  function addRipple(x, y, maxR, strength) {
    if (ripples.length > 60) ripples.shift();
    ripples.push({ x: x, y: y, r: 2, maxR: maxR, alpha: strength });
  }

  // Retire a pellet and free whichever koi was chasing it.
  function release(f) {
    if (!f) return;
    f.alive = false;
    if (f.claimedBy) { f.claimedBy.target = null; f.claimedBy = null; }
  }

  let lastRippleAt = 0;
  canvas.addEventListener('mousemove', function (e) {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.active = true;
    const now = performance.now();
    if (!reduceMotion && now - lastRippleAt > 90) {
      lastRippleAt = now;
      addRipple(mouse.x, mouse.y, 44 + Math.random() * 26, 0.28);
    }
  });

  canvas.addEventListener('mouseleave', function () {
    mouse.active = false;
    mouse.x = mouse.y = -9999;
  });

  function dropFood(x, y) {
    if (food.length > 24) release(food.shift());
    // alive + claimedBy make a pellet a single serving: the first koi to
    // notice it owns it, and nobody else bothers swimming over.
    food.push({
      x: x, y: y,
      life: FOOD_LIFE, max: FOOD_LIFE,
      drift: (Math.random() - 0.5) * 0.12,
      alive: true,
      claimedBy: null
    });
    addRipple(x, y, 120, 0.6);
    addRipple(x, y, 70, 0.45);
  }

  canvas.addEventListener('click', function (e) {
    dropFood(e.clientX, e.clientY);
    sound.plink();
  });

  // Touch support: tap to feed, drag to disturb.
  canvas.addEventListener('touchstart', function (e) {
    const t = e.touches[0];
    dropFood(t.clientX, t.clientY);
  }, { passive: true });

  canvas.addEventListener('touchmove', function (e) {
    const t = e.touches[0];
    mouse.x = t.clientX;
    mouse.y = t.clientY;
    mouse.active = true;
  }, { passive: true });

  canvas.addEventListener('touchend', function () { mouse.active = false; }, { passive: true });

  /* ------------------------------------------------------------------
     Koi
  ------------------------------------------------------------------ */
  const PALETTE = [
    { body: '#f4f1e8', accent: '#e8622c' },  // kohaku (white + orange)
    { body: '#ef7239', accent: '#f9e6c8' },  // orange
    { body: '#f6c96b', accent: '#e8a02c' },  // gold
    { body: '#f4f1e8', accent: '#d94f28' },  // white + deep red
    { body: '#ffb257', accent: '#f7f2e6' }   // amber
  ];

  function Koi(i, total) {
    const angle = Math.random() * Math.PI * 2;
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.vx = Math.cos(angle);
    this.vy = Math.sin(angle);

    this.len = 20 + Math.random() * 16;                 // body length in px
    this.baseLen = this.len;
    this.maxLen = this.baseLen * 1.4;                   // koi only ever get slightly plumper
    this.radius = this.len * 0.5;                       // personal space, scales with size
    this.baseSpeed = (0.55 + Math.random() * 0.4) * speedScale;
    this.maxSpeed = this.baseSpeed;
    this.maxForce = 0.035;
    this.phase = Math.random() * Math.PI * 2;           // tail wave offset
    this.depth = 0.55 + Math.random() * 0.45;           // fake depth -> opacity + scale
    this.heading = angle;                               // smoothed render angle
    this.ax = 0; this.ay = 0;                           // smoothed acceleration
    const c = PALETTE[i % PALETTE.length];
    this.body = c.body;
    this.accent = c.accent;
    this.spots = [];
    const spotCount = 1 + Math.floor(Math.random() * 3);
    for (let s = 0; s < spotCount; s++) {
      this.spots.push({
        along: -0.25 + Math.random() * 0.85,
        off: (Math.random() - 0.5) * 0.35,
        r: 0.13 + Math.random() * 0.16
      });
    }
    this.wander = Math.random() * Math.PI * 2;
    this.wanderVel = 0;                                 // drifts smoothly instead of per-frame noise
    this.target = null;                                 // the pellet this koi has claimed
    this.claimTime = 0;
  }

  /* A well-fed koi fills out a little. Radius follows the new length so the
     separation and overlap passes keep giving bigger fish the room they need,
     and a heavier body cruises marginally slower. */
  Koi.prototype.grow = function (amount) {
    if (this.len >= this.maxLen) return;
    this.len = Math.min(this.maxLen, this.len + amount);
    this.radius = this.len * 0.5;
    const fed = (this.len - this.baseLen) / (this.maxLen - this.baseLen);
    this.maxSpeed = this.baseSpeed * (1 - 0.16 * fed);
  };

  Koi.prototype.steerTo = function (tx, ty, weight, speed) {
    const d = { x: tx - this.x, y: ty - this.y };
    setMag(d, speed === undefined ? this.maxSpeed : speed);
    d.x -= this.vx; d.y -= this.vy;
    limit(d, this.maxForce);
    return { x: d.x * weight, y: d.y * weight };
  };

  Koi.prototype.flock = function (school, sepWeight) {
    const alignR = 96, cohR = 140;
    let sep = { x: 0, y: 0 }, ali = { x: 0, y: 0 }, coh = { x: 0, y: 0 };
    let sepN = 0, aliN = 0, cohN = 0;

    for (let i = 0; i < school.length; i++) {
      const o = school[i];
      if (o === this) continue;
      const dx = this.x - o.x, dy = this.y - o.y;
      const d = Math.hypot(dx, dy);
      if (d === 0) continue;

      // Separation radius scales with both bodies so big koi keep more room.
      const sepR = (this.radius + o.radius) * 1.7;
      if (d < sepR) {
        // Linear falloff. A 1/d^2 term spikes at close range and makes fish
        // twitch, so the weight is bounded and smooth all the way to contact.
        const f = 1 - d / sepR;
        sep.x += (dx / d) * f; sep.y += (dy / d) * f; sepN++;
      }
      if (d < alignR) { ali.x += o.vx; ali.y += o.vy; aliN++; }
      if (d < cohR) { coh.x += o.x; coh.y += o.y; cohN++; }
    }

    const acc = { x: 0, y: 0 };

    if (sepN) {
      sep.x /= sepN; sep.y /= sepN;        // average, not sum, so density does not amplify
      setMag(sep, this.maxSpeed);
      sep.x -= this.vx; sep.y -= this.vy;
      limit(sep, this.maxForce * 1.5);
      const w = sepWeight === undefined ? 1.6 : sepWeight;
      acc.x += sep.x * w; acc.y += sep.y * w;
    }
    if (aliN) {
      ali.x /= aliN; ali.y /= aliN;
      setMag(ali, this.maxSpeed);
      ali.x -= this.vx; ali.y -= this.vy;
      limit(ali, this.maxForce);
      // Alignment is what keeps a tight group moving as one instead of
      // grinding against each other, so it is weighted a little heavier now.
      acc.x += ali.x * 1.15; acc.y += ali.y * 1.15;
    }
    if (cohN) {
      const cx = coh.x / cohN, cy = coh.y / cohN;
      const cd = Math.hypot(cx - this.x, cy - this.y);
      // Do not pull toward the centre once already inside the cluster.
      if (cd > this.radius * 2.4) {
        const c = this.steerTo(cx, cy, 0.55);
        acc.x += c.x; acc.y += c.y;
      }
    }
    return acc;
  };

  Koi.prototype.avoidEdges = function () {
    const m = 90;
    const acc = { x: 0, y: 0 };
    if (this.x < m) acc.x += (1 - this.x / m) * this.maxForce * 3;
    if (this.x > W - m) acc.x -= (1 - (W - this.x) / m) * this.maxForce * 3;
    if (this.y < m) acc.y += (1 - this.y / m) * this.maxForce * 3;
    if (this.y > H - m) acc.y -= (1 - (H - this.y) / m) * this.maxForce * 3;
    return acc;
  };

  Koi.prototype.update = function (school, turtle, dt) {
    let acc = { x: 0, y: 0 };

    // 1. Food overrides flocking. A koi holds a claim on one pellet rather
    //    than re-picking a target every frame, so it commits to the trip.
    if (this.target) {
      this.claimTime += dt;
      if (!this.target.alive || this.claimTime > CLAIM_TIMEOUT) {
        if (this.target.claimedBy === this) this.target.claimedBy = null;
        this.target = null;                   // let a closer koi have a go
      }
    }

    if (!this.target) {
      let bestD = FOOD_SENSE;
      for (let i = 0; i < food.length; i++) {
        const f = food[i];
        if (!f.alive || f.claimedBy) continue;   // already someone else's meal
        const d = Math.hypot(f.x - this.x, f.y - this.y);
        if (d < bestD) { bestD = d; this.target = f; }
      }
      if (this.target) { this.target.claimedBy = this; this.claimTime = 0; }
    }

    const target = this.target;
    let speedCap = this.maxSpeed;

    if (target) {
      const dist = Math.hypot(target.x - this.x, target.y - this.y);
      // Full dash the whole way in. No arrival easing is needed now that the
      // pellet is gone on contact, so there is nothing left to circle and
      // oscillate around, which is what the easing was guarding against.
      const dash = this.maxSpeed * 1.95;
      speedCap = dash;
      const s = this.steerTo(target.x, target.y, 2.8, dash);
      acc.x += s.x; acc.y += s.y;
      // Lighter separation than before: with one koi per pellet there is no
      // pile-up to break up, and relax() still keeps bodies from overlapping.
      const sep = this.flock(school, 1.1);
      acc.x += sep.x; acc.y += sep.y;

      if (dist < this.radius * 0.7 + 6) {
        release(target);                      // eaten, and gone for good
        this.grow(this.baseLen * 0.06);
        addRipple(this.x, this.y, 34, 0.3);
        sound.plink();
      }
    } else {
      acc = this.flock(school);
    }

    // 2. Cursor repulsion, the "disturbed water" effect.
    if (mouse.active) {
      const dx = this.x - mouse.x, dy = this.y - mouse.y;
      const d = Math.hypot(dx, dy);
      if (d < REPEL_RADIUS && d > 0) {
        const flee = { x: dx / d, y: dy / d };
        const strength = (1 - d / REPEL_RADIUS);
        setMag(flee, this.maxSpeed * (1 + strength));
        flee.x -= this.vx; flee.y -= this.vy;
        limit(flee, this.maxForce * 9 * strength);
        acc.x += flee.x; acc.y += flee.y;
        speedCap = Math.max(speedCap, this.maxSpeed * 1.9);
      }
    }

    // 3. Give the turtle a wide berth.
    if (turtle) {
      const dx = this.x - turtle.x, dy = this.y - turtle.y;
      const d = Math.hypot(dx, dy);
      const zone = this.radius + turtle.radius * 1.5;
      if (d < zone && d > 0) {
        const f = (1 - d / zone) * this.maxForce * 2.4;
        acc.x += (dx / d) * f; acc.y += (dy / d) * f;
      }
    }

    // 4. Lazy wandering. The drift itself is what varies, so the heading
    //    changes on a slow curve rather than a new random jolt every frame.
    this.wanderVel += (Math.random() - 0.5) * 0.06;
    this.wanderVel *= 0.94;
    this.wander += this.wanderVel;
    acc.x += Math.cos(this.wander) * 0.005;
    acc.y += Math.sin(this.wander) * 0.005;

    const edge = this.avoidEdges();
    acc.x += edge.x; acc.y += edge.y;

    // Low-pass filter the acceleration. Any remaining frame-to-frame
    // disagreement between the forces gets smoothed out here.
    const k = Math.min(1, 7 * dt);
    this.ax += (acc.x - this.ax) * k;
    this.ay += (acc.y - this.ay) * k;

    this.vx += this.ax; this.vy += this.ay;
    const v = limit({ x: this.vx, y: this.vy }, speedCap);
    this.vx = v.x; this.vy = v.y;

    const speed = Math.hypot(this.vx, this.vy);
    if (speed < 0.12) { setMag(v, 0.12); this.vx = v.x; this.vy = v.y; }

    this.x += this.vx * dt * 60;
    this.y += this.vy * dt * 60;

    // Carried along by the current on top of their own swimming.
    const cur = current(this.x, this.y);
    this.x += cur.x * dt * 60;
    this.y += cur.y * dt * 60;

    // Hard clamp in case of a resize while a fish is off-screen.
    this.x = Math.max(-40, Math.min(W + 40, this.x));
    this.y = Math.max(-40, Math.min(H + 40, this.y));

    // Turn the drawn body toward the velocity gradually so a sharp course
    // correction reads as a bank, not a snap.
    let diff = Math.atan2(this.vy, this.vx) - this.heading;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    this.heading += diff * Math.min(1, 5 * dt);

    this.phase += (0.12 + speed * 0.5) * dt * 60 * 0.16;
  };

  Koi.prototype.draw = function (ctx) {
    const a = this.heading;
    const L = this.len * (0.75 + this.depth * 0.45);
    const Wd = L * 0.42;
    const wag = Math.sin(this.phase) * 0.42;

    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(a);

    // Shadow on the pond floor for a sense of depth.
    ctx.save();
    ctx.globalAlpha = 0.16 * this.depth;
    ctx.fillStyle = '#02191b';
    ctx.beginPath();
    ctx.ellipse(-L * 0.1 + 5, 7, L * 0.55, Wd * 0.62, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.globalAlpha = 0.55 + this.depth * 0.45;

    // Tail: two soft fins that sweep with the body wave.
    ctx.fillStyle = this.body;
    ctx.globalAlpha *= 0.75;
    for (let s = -1; s <= 1; s += 2) {
      ctx.beginPath();
      ctx.moveTo(-L * 0.42, 0);
      ctx.quadraticCurveTo(
        -L * 0.78, wag * L * 0.35 + s * Wd * 0.28,
        -L * 1.02, wag * L * 0.7 + s * Wd * 0.72
      );
      ctx.quadraticCurveTo(-L * 0.7, wag * L * 0.4 + s * Wd * 0.2, -L * 0.42, 0);
      ctx.fill();
    }
    ctx.globalAlpha = 0.55 + this.depth * 0.45;

    // Pectoral fins.
    ctx.globalAlpha *= 0.6;
    for (let s = -1; s <= 1; s += 2) {
      ctx.beginPath();
      ctx.moveTo(L * 0.06, s * Wd * 0.3);
      ctx.quadraticCurveTo(-L * 0.12, s * Wd * 1.05 + wag * 4, -L * 0.24, s * Wd * 0.5);
      ctx.quadraticCurveTo(-L * 0.1, s * Wd * 0.35, L * 0.06, s * Wd * 0.3);
      ctx.fill();
    }
    ctx.globalAlpha = 0.55 + this.depth * 0.45;

    // Body: a teardrop, rounded at the head and tapered at the tail.
    ctx.beginPath();
    ctx.moveTo(L * 0.55, 0);
    ctx.bezierCurveTo(L * 0.5, -Wd, -L * 0.1, -Wd, -L * 0.42, -Wd * 0.16 + wag * 3);
    ctx.bezierCurveTo(-L * 0.5, 0, -L * 0.5, 0, -L * 0.42, Wd * 0.16 + wag * 3);
    ctx.bezierCurveTo(-L * 0.1, Wd, L * 0.5, Wd, L * 0.55, 0);
    ctx.closePath();

    const grad = ctx.createLinearGradient(-L * 0.4, 0, L * 0.55, 0);
    grad.addColorStop(0, this.accent);
    grad.addColorStop(0.45, this.body);
    grad.addColorStop(1, this.body);
    ctx.fillStyle = grad;
    ctx.fill();

    // Markings, clipped to the body so they never bleed outside.
    ctx.save();
    ctx.clip();
    ctx.fillStyle = this.accent;
    ctx.globalAlpha *= 0.85;
    for (let i = 0; i < this.spots.length; i++) {
      const sp = this.spots[i];
      ctx.beginPath();
      ctx.ellipse(sp.along * L * 0.5, sp.off * Wd * 1.6, L * sp.r, Wd * sp.r * 1.5, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    // Highlight along the spine.
    ctx.globalAlpha = 0.18 * this.depth;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.ellipse(L * 0.12, -Wd * 0.34, L * 0.3, Wd * 0.16, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  };

  /* ------------------------------------------------------------------
     Turtle: same steering ideas, much slower, does not flock or chase food.
  ------------------------------------------------------------------ */
  function Turtle() {
    const angle = Math.random() * Math.PI * 2;
    this.x = W * 0.5 + (Math.random() - 0.5) * W * 0.3;
    this.y = H * 0.5 + (Math.random() - 0.5) * H * 0.3;
    this.vx = Math.cos(angle) * 0.15;
    this.vy = Math.sin(angle) * 0.15;
    this.len = 52;
    this.radius = 30;
    this.maxSpeed = 0.26 * speedScale;
    this.maxForce = 0.01;
    this.heading = angle;
    this.wander = angle;
    this.wanderVel = 0;
    this.phase = 0;
    this.depth = 0.4;          // sits below the koi in the draw order
    this.ax = 0; this.ay = 0;
  }

  Turtle.prototype.avoidEdges = Koi.prototype.avoidEdges;

  Turtle.prototype.update = function (dt) {
    const acc = { x: 0, y: 0 };

    this.wanderVel += (Math.random() - 0.5) * 0.03;
    this.wanderVel *= 0.96;
    this.wander += this.wanderVel;
    acc.x += Math.cos(this.wander) * 0.004;
    acc.y += Math.sin(this.wander) * 0.004;

    // Barely bothered by the cursor, just drifts aside.
    if (mouse.active) {
      const dx = this.x - mouse.x, dy = this.y - mouse.y;
      const d = Math.hypot(dx, dy);
      if (d < REPEL_RADIUS * 1.1 && d > 0) {
        const f = (1 - d / (REPEL_RADIUS * 1.1)) * this.maxForce * 3;
        acc.x += (dx / d) * f; acc.y += (dy / d) * f;
      }
    }

    const edge = this.avoidEdges();
    acc.x += edge.x * 0.5; acc.y += edge.y * 0.5;

    const k = Math.min(1, 5 * dt);
    this.ax += (acc.x - this.ax) * k;
    this.ay += (acc.y - this.ay) * k;

    this.vx += this.ax; this.vy += this.ay;
    const v = limit({ x: this.vx, y: this.vy }, this.maxSpeed);
    this.vx = v.x; this.vy = v.y;
    if (Math.hypot(this.vx, this.vy) < 0.06) { setMag(v, 0.06); this.vx = v.x; this.vy = v.y; }

    this.x += this.vx * dt * 60;
    this.y += this.vy * dt * 60;
    const cur = current(this.x, this.y);
    this.x += cur.x * dt * 60;
    this.y += cur.y * dt * 60;
    this.x = Math.max(-30, Math.min(W + 30, this.x));
    this.y = Math.max(-30, Math.min(H + 30, this.y));

    let diff = Math.atan2(this.vy, this.vx) - this.heading;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    this.heading += diff * Math.min(1, 2.5 * dt);

    this.phase += dt * 2.4;
  };

  Turtle.prototype.draw = function (ctx) {
    const L = this.len;
    const shellW = L * 0.46, shellH = L * 0.4;
    const paddle = Math.sin(this.phase);

    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.heading);

    // Floor shadow.
    ctx.save();
    ctx.globalAlpha = 0.2;
    ctx.fillStyle = '#02191b';
    ctx.beginPath();
    ctx.ellipse(6, 8, shellW * 1.02, shellH * 0.95, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.globalAlpha = 0.92;

    // Flippers: front pair sweeps, rear pair trails.
    ctx.fillStyle = '#5c8f70';
    for (let s = -1; s <= 1; s += 2) {
      ctx.save();
      ctx.translate(shellW * 0.5, s * shellH * 0.62);
      ctx.rotate(s * (0.5 + paddle * 0.4));
      ctx.beginPath();
      ctx.ellipse(L * 0.16, 0, L * 0.2, L * 0.085, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.translate(-shellW * 0.6, s * shellH * 0.58);
      ctx.rotate(s * (-0.7 - paddle * 0.25));
      ctx.beginPath();
      ctx.ellipse(-L * 0.1, 0, L * 0.13, L * 0.065, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // Head and tail.
    ctx.beginPath();
    ctx.ellipse(shellW * 1.03, paddle * L * 0.03, L * 0.14, L * 0.1, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-shellW * 0.95, -L * 0.04);
    ctx.lineTo(-shellW * 1.22, 0);
    ctx.lineTo(-shellW * 0.95, L * 0.04);
    ctx.closePath();
    ctx.fill();

    // Eyes.
    ctx.fillStyle = '#12261f';
    for (let s = -1; s <= 1; s += 2) {
      ctx.beginPath();
      ctx.arc(shellW * 1.12, s * L * 0.05 + paddle * L * 0.03, L * 0.019, 0, Math.PI * 2);
      ctx.fill();
    }

    // Shell.
    ctx.beginPath();
    ctx.ellipse(0, 0, shellW, shellH, 0, 0, Math.PI * 2);
    const shell = ctx.createRadialGradient(-shellW * 0.25, -shellH * 0.35, L * 0.05, 0, 0, shellW * 1.15);
    shell.addColorStop(0, '#4b8a67');
    shell.addColorStop(0.6, '#2f6049');
    shell.addColorStop(1, '#1d4034');
    ctx.fillStyle = shell;
    ctx.fill();

    // Scutes, clipped inside the shell.
    ctx.save();
    ctx.clip();
    ctx.strokeStyle = 'rgba(20, 48, 38, 0.75)';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.ellipse(0, 0, shellW * 0.5, shellH * 0.52, 0, 0, Math.PI * 2);
    ctx.stroke();
    for (let i = 0; i < 6; i++) {
      const th = (i / 6) * Math.PI * 2 + 0.5;
      ctx.beginPath();
      ctx.moveTo(Math.cos(th) * shellW * 0.5, Math.sin(th) * shellH * 0.52);
      ctx.lineTo(Math.cos(th) * shellW * 1.1, Math.sin(th) * shellH * 1.1);
      ctx.stroke();
    }
    ctx.restore();

    // Rim and a soft highlight on the carapace.
    ctx.strokeStyle = 'rgba(140, 200, 170, 0.35)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.ellipse(0, 0, shellW, shellH, 0, 0, Math.PI * 2);
    ctx.stroke();

    ctx.globalAlpha = 0.14;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.ellipse(-shellW * 0.22, -shellH * 0.42, shellW * 0.3, shellH * 0.16, -0.3, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  };

  const COUNT = window.innerWidth < 600 ? 19 : 23;
  const school = [];
  for (let i = 0; i < COUNT; i++) school.push(new Koi(i, COUNT));

  const turtle = new Turtle();
  const agents = school.concat([turtle]);

  /* Final overlap pass: nudge positions apart directly instead of asking the
     steering forces to resolve contact. This is what stops the bumping. */
  function relax(list) {
    for (let i = 0; i < list.length; i++) {
      for (let j = i + 1; j < list.length; j++) {
        const a = list[i], b = list[j];
        const dx = b.x - a.x, dy = b.y - a.y;
        const d = Math.hypot(dx, dy);
        const min = (a.radius + b.radius) * 0.85;
        if (d > 0 && d < min) {
          const push = ((min - d) / d) * 0.2;
          const ox = dx * push, oy = dy * push;
          const aw = a === turtle ? 0.15 : 1;   // the turtle holds its ground
          const bw = b === turtle ? 0.15 : 1;
          a.x -= ox * aw; a.y -= oy * aw;
          b.x += ox * bw; b.y += oy * bw;
        }
      }
    }
  }

  /* ------------------------------------------------------------------
     Ambience. None of this reacts to the user; it exists to give the eye
     something slow and undemanding to follow while the koi do their thing.
  ------------------------------------------------------------------ */

  function drawLotus(ctx, r) {
    const s = r * 0.4;
    ctx.save();
    ctx.translate(r * 0.08, -r * 0.1);
    for (let layer = 0; layer < 2; layer++) {
      const n = layer ? 5 : 6;
      const len = s * (layer ? 0.62 : 1);
      ctx.fillStyle = layer ? '#fff3f5' : 'rgba(246, 193, 206, 0.95)';
      for (let i = 0; i < n; i++) {
        ctx.save();
        ctx.rotate((i / n) * Math.PI * 2 + layer * 0.55);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(len * 0.5, -len * 0.32, len, 0);
        ctx.quadraticCurveTo(len * 0.5, len * 0.32, 0, 0);
        ctx.fill();
        ctx.restore();
      }
    }
    ctx.fillStyle = '#f4d67c';
    ctx.beginPath();
    ctx.arc(0, 0, s * 0.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function LilyPad(initial) {
    this.r = 24 + Math.random() * 26;
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.rot = Math.random() * Math.PI * 2;
    this.rotVel = (Math.random() - 0.5) * 0.045 * speedScale;
    this.bob = Math.random() * Math.PI * 2;
    this.flower = initial < 2;                  // a couple of them bloom
  }

  LilyPad.prototype.update = function (dt) {
    const cur = current(this.x, this.y);
    this.x += cur.x * dt * 22;                  // pads sit on the surface, so they lag
    this.y += cur.y * dt * 22;
    this.rot += this.rotVel * dt;
    this.bob += dt * 0.45;
    const pad = this.r * 1.6;
    if (this.x < -pad) this.x = W + pad;
    if (this.x > W + pad) this.x = -pad;
    if (this.y < -pad) this.y = H + pad;
    if (this.y > H + pad) this.y = -pad;
  };

  LilyPad.prototype.draw = function (ctx) {
    const r = this.r * (1 + Math.sin(this.bob) * 0.015);
    const gap = 0.4;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rot);

    ctx.globalAlpha = 0.2;
    ctx.fillStyle = '#03201f';
    ctx.beginPath();
    ctx.ellipse(5, 7, r, r * 0.95, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.globalAlpha = 0.94;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, r, gap, Math.PI * 2 - gap);
    ctx.closePath();
    const g = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.08, 0, 0, r);
    g.addColorStop(0, '#43815a');
    g.addColorStop(0.7, '#2c5c40');
    g.addColorStop(1, '#1e4430');
    ctx.fillStyle = g;
    ctx.fill();

    ctx.save();
    ctx.clip();
    ctx.strokeStyle = 'rgba(16, 46, 32, 0.45)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= 8; i++) {
      const a = gap + (i / 8) * (Math.PI * 2 - gap * 2);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      ctx.stroke();
    }
    ctx.restore();

    ctx.strokeStyle = 'rgba(150, 212, 172, 0.25)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.arc(0, 0, r, gap, Math.PI * 2 - gap);
    ctx.stroke();

    if (this.flower) drawLotus(ctx, r);
    ctx.restore();
  };

  function Petal(initial) { this.reset(initial); }

  Petal.prototype.reset = function (initial) {
    this.x = initial ? Math.random() * W : -30 - Math.random() * 60;
    this.y = initial ? Math.random() * H : Math.random() * H;
    this.s = 3.5 + Math.random() * 4;
    this.rot = Math.random() * Math.PI * 2;
    this.rotVel = (Math.random() - 0.5) * 0.6 * speedScale;
    this.vx = (0.1 + Math.random() * 0.16) * speedScale;
    this.wob = Math.random() * Math.PI * 2;
    this.alpha = 0.45 + Math.random() * 0.35;
  };

  Petal.prototype.update = function (dt) {
    const cur = current(this.x, this.y);
    this.wob += dt * 0.6;
    this.x += (this.vx + cur.x * 1.4) * dt * 60;
    this.y += (cur.y * 1.4 + Math.sin(this.wob) * 0.05) * dt * 60;
    this.rot += this.rotVel * dt;
    if (this.x > W + 40 || this.y < -40 || this.y > H + 40) this.reset(false);
  };

  Petal.prototype.draw = function (ctx) {
    const s = this.s;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rot);
    ctx.globalAlpha = this.alpha * 0.35;
    ctx.fillStyle = '#000000';
    ctx.beginPath();
    ctx.ellipse(1.5, 2, s, s * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = this.alpha;
    ctx.fillStyle = '#f9dde4';
    ctx.beginPath();
    ctx.moveTo(-s, 0);
    ctx.quadraticCurveTo(0, -s * 0.75, s, 0);
    ctx.quadraticCurveTo(0, s * 0.75, -s, 0);
    ctx.fill();
    ctx.restore();
  };

  /* Top-down view, so a bubble surfaces toward the camera: it swells,
     fades, and leaves a small ring behind. */
  function Bubble() { this.reset(true); }

  Bubble.prototype.reset = function (initial) {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.t = 0;
    this.dur = 2.2 + Math.random() * 2.2;
    this.delay = initial ? Math.random() * 8 : 2 + Math.random() * 9;
    this.r = 1.6 + Math.random() * 2.4;
  };

  Bubble.prototype.update = function (dt) {
    if (this.delay > 0) { this.delay -= dt; return; }
    this.t += dt;
    const cur = current(this.x, this.y);
    this.x += cur.x * dt * 40;
    this.y += cur.y * dt * 40;
    if (this.t >= this.dur) {
      addRipple(this.x, this.y, 16, 0.14);
      this.reset(false);
    }
  };

  Bubble.prototype.draw = function (ctx) {
    if (this.delay > 0 || this.t <= 0) return;
    const p = this.t / this.dur;
    const r = this.r * (0.5 + p * 0.9);
    const a = Math.sin(p * Math.PI) * 0.4;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.strokeStyle = 'rgba(200, 240, 228, 0.9)';
    ctx.lineWidth = 0.9;
    ctx.beginPath();
    ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = a * 0.5;
    ctx.fillStyle = 'rgba(220, 250, 240, 0.7)';
    ctx.beginPath();
    ctx.arc(this.x - r * 0.3, this.y - r * 0.3, r * 0.35, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  };

  const pads = [];
  for (let i = 0; i < 6; i++) pads.push(new LilyPad(i));

  const petals = [];
  for (let i = 0; i < 16; i++) petals.push(new Petal(true));

  const bubbles = [];
  for (let i = 0; i < 9; i++) bubbles.push(new Bubble());

  // Duckweed: tiny specks on the surface, pure texture.
  const weed = [];
  for (let i = 0; i < 70; i++) {
    weed.push({
      x: Math.random(), y: Math.random(),
      r: 0.8 + Math.random() * 1.6,
      a: 0.1 + Math.random() * 0.22
    });
  }

  // Stones resting on the pond floor, in normalised coords so they survive a resize.
  const stones = [];
  for (let i = 0; i < 7; i++) {
    stones.push({
      x: Math.random(), y: Math.random(),
      rx: 30 + Math.random() * 70, ry: 22 + Math.random() * 45,
      rot: Math.random() * Math.PI, a: 0.1 + Math.random() * 0.12
    });
  }

  function drawStones() {
    ctx.save();
    for (let i = 0; i < stones.length; i++) {
      const s = stones[i];
      ctx.globalAlpha = s.a;
      ctx.fillStyle = '#04191c';
      ctx.beginPath();
      ctx.ellipse(s.x * W, s.y * H, s.rx, s.ry, s.rot, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawWeed(dt) {
    ctx.save();
    ctx.fillStyle = '#8fc79c';
    for (let i = 0; i < weed.length; i++) {
      const w = weed[i];
      const px = w.x * W, py = w.y * H;
      const cur = current(px, py);
      w.x += (cur.x * dt * 12) / W;
      w.y += (cur.y * dt * 12) / H;
      if (w.x > 1) w.x -= 1; if (w.x < 0) w.x += 1;
      if (w.y > 1) w.y -= 1; if (w.y < 0) w.y += 1;
      ctx.globalAlpha = w.a;
      ctx.beginPath();
      ctx.arc(px, py, w.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  /* ------------------------------------------------------------------
     Ambient soundscape, synthesised on the fly so the page stays
     asset-free. Opt-in only, and it remembers the choice.
  ------------------------------------------------------------------ */
  const sound = (function () {
    const SCALE = [293.66, 329.63, 369.99, 440.00, 493.88, 587.33]; // D major pentatonic
    let ac = null, master = null, on = false, next = 6;

    function build() {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      ac = new AC();

      master = ac.createGain();
      master.gain.value = 0;
      master.connect(ac.destination);

      // Water bed: brown noise through a slowly swept lowpass.
      const len = Math.floor(ac.sampleRate * 3);
      const buf = ac.createBuffer(1, len, ac.sampleRate);
      const data = buf.getChannelData(0);
      let lastOut = 0;
      for (let i = 0; i < len; i++) {
        const white = Math.random() * 2 - 1;
        lastOut = (lastOut + 0.022 * white) / 1.022;
        data[i] = lastOut * 3.2;
      }
      const src = ac.createBufferSource();
      src.buffer = buf;
      src.loop = true;

      const lp = ac.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = 380;
      lp.Q.value = 0.5;

      const lfo = ac.createOscillator();
      lfo.frequency.value = 0.06;
      const lfoAmt = ac.createGain();
      lfoAmt.gain.value = 150;
      lfo.connect(lfoAmt);
      lfoAmt.connect(lp.frequency);

      const bed = ac.createGain();
      bed.gain.value = 0.55;

      src.connect(lp);
      lp.connect(bed);
      bed.connect(master);
      src.start();
      lfo.start();
      return true;
    }

    function tone(freq, vel, dur, type) {
      if (!ac || !on) return;
      const t0 = ac.currentTime;
      const osc = ac.createOscillator();
      osc.type = type || 'sine';
      osc.frequency.value = freq;
      const g = ac.createGain();
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(vel, t0 + 0.06);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      const lp = ac.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = 1800;
      osc.connect(g);
      g.connect(lp);
      lp.connect(master);
      osc.start(t0);
      osc.stop(t0 + dur + 0.05);
    }

    return {
      enabled: function () { return on; },

      toggle: function () {
        if (!ac && !build()) return false;
        on = !on;
        if (on && ac.state === 'suspended') ac.resume();
        const t0 = ac.currentTime;
        master.gain.cancelScheduledValues(t0);
        master.gain.setValueAtTime(master.gain.value, t0);
        // Long ramps so it never startles anyone.
        master.gain.linearRampToValueAtTime(on ? 0.16 : 0, t0 + (on ? 3 : 1.2));
        return on;
      },

      // A pellet hitting the water.
      plink: function () {
        tone(SCALE[Math.floor(Math.random() * SCALE.length)] * 2, 0.05, 0.5, 'triangle');
      },

      // Occasional koto-ish note, spaced far enough apart to stay background.
      tick: function (dt) {
        if (!on) return;
        next -= dt;
        if (next <= 0) {
          next = 7 + Math.random() * 11;
          const f = SCALE[Math.floor(Math.random() * SCALE.length)];
          tone(f, 0.06, 4.5);
          tone(f * 2, 0.02, 3.5);
        }
      }
    };
  })();

  const soundBtn = document.querySelector('.sound-toggle');
  soundBtn.addEventListener('click', function () {
    const nowOn = sound.toggle();
    soundBtn.setAttribute('aria-pressed', nowOn ? 'true' : 'false');
    try { localStorage.setItem('koiSound', nowOn ? '1' : '0'); } catch (e) { /* private mode */ }
  });

  // Browsers require a gesture before audio starts, so a remembered
  // preference is honoured on the first interaction rather than on load.
  let wantedSound = false;
  try { wantedSound = localStorage.getItem('koiSound') === '1'; } catch (e) { /* ignore */ }
  if (wantedSound) {
    const startOnce = function () {
      if (!sound.enabled()) {
        soundBtn.setAttribute('aria-pressed', sound.toggle() ? 'true' : 'false');
      }
      window.removeEventListener('pointerdown', startOnce);
      window.removeEventListener('keydown', startOnce);
    };
    window.addEventListener('pointerdown', startOnce);
    window.addEventListener('keydown', startOnce);
  }

  /* ------------------------------------------------------------------
     Pond rendering
  ------------------------------------------------------------------ */
  function drawWater(t) {
    const g = ctx.createLinearGradient(0, 0, W * 0.4, H);
    g.addColorStop(0, '#0f4a48');
    g.addColorStop(0.5, '#0a3839');
    g.addColorStop(1, '#062628');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // Slow drifting light patches, cheap stand-in for caustics.
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 3; i++) {
      const px = W * (0.25 + 0.3 * i) + Math.sin(t * 0.00007 + i * 2.1) * W * 0.16;
      const py = H * (0.3 + 0.22 * i) + Math.cos(t * 0.00009 + i * 1.4) * H * 0.14;
      const r = Math.max(W, H) * 0.34;
      const rg = ctx.createRadialGradient(px, py, 0, px, py, r);
      rg.addColorStop(0, 'rgba(120, 214, 190, 0.055)');
      rg.addColorStop(1, 'rgba(120, 214, 190, 0)');
      ctx.fillStyle = rg;
      ctx.fillRect(px - r, py - r, r * 2, r * 2);
    }
    ctx.restore();
  }

  function drawRipples(dt) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = ripples.length - 1; i >= 0; i--) {
      const r = ripples[i];
      r.r += (r.maxR - r.r) * 2.2 * dt + 8 * dt;
      r.alpha -= 0.5 * dt;
      if (r.alpha <= 0 || r.r >= r.maxR) { ripples.splice(i, 1); continue; }
      ctx.beginPath();
      ctx.strokeStyle = 'rgba(180, 235, 220, ' + Math.max(0, r.alpha).toFixed(3) + ')';
      ctx.lineWidth = 1.2;
      ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawFood(dt) {
    for (let i = food.length - 1; i >= 0; i--) {
      const f = food[i];
      f.life -= dt;
      if (f.life <= 0 || !f.alive) { release(f); food.splice(i, 1); continue; }
      const cur = current(f.x, f.y);
      f.x += f.drift + cur.x * 1.6;
      f.y += 0.04 + cur.y * 1.6;
      const fade = Math.min(1, f.life / 2.5);
      ctx.save();
      ctx.globalAlpha = 0.9 * fade;
      const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, 6);
      g.addColorStop(0, '#fff3d0');
      g.addColorStop(1, 'rgba(226, 178, 96, 0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(f.x, f.y, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#e8c07a';
      ctx.beginPath();
      ctx.arc(f.x, f.y, 2.1, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  let last = performance.now();
  let nextDrop = 5 + Math.random() * 6;

  function frame(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05;   // keep the sim stable after a tab switch
    T = now;

    // --- pond floor ---
    drawWater(now);
    drawStones();

    // --- mid water ---
    drawFood(dt);

    turtle.update(dt);
    for (let i = 0; i < school.length; i++) school[i].update(school, turtle, dt);
    relax(agents);

    // Back-to-front so deeper fish render underneath.
    agents.sort(function (a, b) { return a.depth - b.depth; });
    for (let i = 0; i < agents.length; i++) agents[i].draw(ctx);

    // --- surface ---
    for (let i = 0; i < bubbles.length; i++) { bubbles[i].update(dt); bubbles[i].draw(ctx); }
    drawRipples(dt);
    drawWeed(dt);
    for (let i = 0; i < pads.length; i++) { pads[i].update(dt); pads[i].draw(ctx); }
    for (let i = 0; i < petals.length; i++) { petals[i].update(dt); petals[i].draw(ctx); }

    // A stray drop lands every few seconds, so the water is never quite still
    // even when nobody is touching it.
    nextDrop -= dt;
    if (nextDrop <= 0) {
      nextDrop = 4 + Math.random() * 7;
      const dx = Math.random() * W, dy = Math.random() * H;
      addRipple(dx, dy, 60 + Math.random() * 50, 0.22);
      addRipple(dx, dy, 30, 0.16);
      sound.plink();
    }

    sound.tick(dt);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
